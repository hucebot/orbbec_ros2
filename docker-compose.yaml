services:
  orbbec_ros2:
    image: orbbec_ros2:latest
    build:
      context: .
      dockerfile: .ci/Dockerfile
      target: dep
    container_name: orbbec_deploy
    user: root
    privileged: true
    network_mode: host
    ipc: host
    pid: host
    restart: always
    env_file:
      - .env
    environment:
      - DEPLOYMENT_ENV=${DEPLOYMENT_ENV:-robot}
      - DISPLAY=${DISPLAY}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
      - /run/udev:/run/udev
    devices:
      - /dev/dri:/dev/dri
      - /dev/snd:/dev/snd
      - /dev/input:/dev/input
      - /dev/bus/usb:/dev/bus/usb
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]